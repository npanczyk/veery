[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "veery"
version = "0.1.0a1"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "tqdm",
]
requires-python = ">=3.12"
authors = [
    {name = "Nataly Panczyk", email = "nrpanczyk@gmail.com"}
]
maintainers = [
    {name = "Nataly Panczyk", email = "nrpanczyk@gmail.com"}
]
description = "A Validation Environment for Exposing RiskY models"
readme = "README.md"
license = "MIT"
keywords = ["falsification", "validation", "reinforcement learning", "MCTS", "controllers"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Repository = "https://github.com/npanczyk/veery"
Issues = "https://github.com/npanczyk/veery/issues"

[project.optional-dependencies]
dev = ["pytest"]
experiments = ["stable-baselines3[extra]", "tensorboard", "gymnasium==1.3.0", "optuna"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["experiments"]
[tool.hatch.build.targets.sdist]
exclude = ["experiments", "environment.yml", ".gitignore"]
